services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: limiance
      POSTGRES_USER: limiance
      POSTGRES_PASSWORD: development-only
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limiance -d limiance"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --appendonly yes
  localstack:
    image: localstack/localstack:4.12.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: eu-central-1
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./scripts/localstack-init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
volumes:
  postgres-data:
