services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: limiance
      POSTGRES_USER: limiance
      POSTGRES_PASSWORD: development-only
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limiance -d limiance"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --appendonly yes
  localstack:
    image: localstack/localstack:4.12.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: eu-central-1
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./scripts/localstack-init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/limiance.yml:ro
      - ./observability/grafana-dashboard.yml:/etc/grafana/provisioning/dashboards/limiance.yml:ro
      - ./observability/limiance-dashboard.json:/var/lib/grafana/dashboards/limiance.json:ro
volumes:
  postgres-data:
