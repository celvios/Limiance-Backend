openapi: 3.1.0
info:
  title: Limiance API
  version: 0.1.0
  description: Exchange foundation API. All money-moving endpoints require Idempotency-Key.
servers:
  - url: https://api.limiance.example/v1
paths:
  /:
    get:
      responses:
        '200': { description: API index }
  /metrics:
    get:
      responses:
        '200': { description: Prometheus metrics exposition }
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: Process is healthy
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/register:
    post:
      summary: Register an account
      responses:
        '202': { description: Verification challenge created }
  /auth/login:
    post:
      summary: Log in with a verified account
      responses:
        '200': { description: Secure HTTP-only session cookie issued }
        '401': { description: Invalid credentials }
        '403': { description: Email verification is required }
  /auth/subaccount/login:
    post:
      summary: Log in to a custom subaccount
      description: Issues an isolated subaccount session; owner-only routes are unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: Isolated subaccount session cookie issued }
        '401': { description: Invalid credentials }
        '403': { description: Subaccount is unavailable }
  /auth/email/verify:
    post:
      summary: Verify a pending registration email code
      responses:
        '200': { description: Account activated }
        '400': { description: Invalid, expired, or exhausted code }
  /auth/session:
    get:
      summary: Return the authenticated session identity
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Authenticated identity }
        '401': { description: No active session }
  /auth/logout:
    post:
      summary: Revoke the current session
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Session revoked }
  /user/fees:
    get:
      summary: Return the authenticated user's current fee tier and rates
      security: [{ sessionCookie: [] }]
      parameters:
        - name: pair
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Current VIP tier, rolling volume, and maker/taker rates }
        '401': { description: No active session }
  /assets/catalog:
    get:
      summary: List approved assets and target networks
      description: >-
        Catalog entries are policy-approved only. Their pending statuses do not
        represent enabled deposit, withdrawal, or trading routes.
      responses:
        '200':
          description: Asset and network policy catalog
          content:
            application/json:
              schema:
                type: object
                required: [assets, networks]
                properties:
                  assets:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogItem' }
                  networks:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogItem' }
  /kyc/sessions:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Sumsub verification session created }
  /wallet/deposit-addresses:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Deposit address created or returned }
  /transfers:
    post:
      summary: Transfer between permitted accounts or users
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Transfer posted }
  /conversions/quotes:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Short-lived conversion quote }
  /conversions/{quote_id}/execute:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Conversion posted }
  /withdrawals:
    get:
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Withdrawal history }
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { description: Withdrawal submitted for risk evaluation }
        '409':
          description: Withdrawal rejected by balance, route, or deposit-entitlement policy. When test-money protection is active, withdrawals cannot exceed remaining confirmed deposits of the same token on the same network.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, example: withdrawal_deposit_limit }
                  message: { type: string }
  /notifications:
    post:
      summary: Create an in-app notification for the authenticated user
      description: Internal notification producers use this idempotent endpoint. The same event and reference are a no-op.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNotificationRequest' }
      responses:
        '201':
          description: Notification created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationResponse' }
        '200': { description: Existing notification returned for an idempotent retry }
    get:
      summary: List the authenticated user's notifications
      security: [{ sessionCookie: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: created_before
          in: query
          description: Return notifications created before this RFC3339 timestamp.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Notifications and unread badge count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationListResponse' }
  /notifications/{notification_id}/read:
    patch:
      summary: Mark one notification read
      security: [{ sessionCookie: [] }]
      parameters:
        - name: notification_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Notification marked read }
        '404': { description: Notification not found }
    post: &standardPost
      responses:
        '200': { description: Successful response }
        default: { $ref: '#/components/responses/Error' }
    delete: &standardDelete
      responses:
        '200': { description: Successful response }
        default: { $ref: '#/components/responses/Error' }
  /notifications/read-all:
    patch:
      summary: Mark all notifications read
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Notifications marked read }
  /accounts/balances:
    get:
      summary: Return balances for the active account
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Account-scoped balances }
  /accounts/transactions:
    get:
      summary: Return ledger transactions for the active subaccount or user
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Account-scoped transaction history }
  /admin/audit-events:
    get:
      summary: List redacted audit events
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: resource_id, in: query, schema: { type: string } }
      responses:
        '200': { description: Audit events }
        '403': { description: Auditor role required }
  /readyz:
    get: &standardGet
      responses:
        '200': { description: Successful response }
        default: { $ref: '#/components/responses/Error' }
  /webhooks/fireblocks:
    post: *standardPost
  /webhooks/sumsub: { post: *standardPost }
  /auth/google/start: { get: *standardGet }
  /auth/google/callback: { get: *standardGet }
  /auth/telegram/start: { get: *standardGet }
  /auth/telegram/callback: { get: *standardGet }
  /auth/totp/verify: { post: *standardPost }
  /auth/password-reset/request: { post: *standardPost }
  /auth/password-reset/confirm: { post: *standardPost }
  /auth/mfa/recover: { post: *standardPost }
  /auth/email/resend: { post: *standardPost }
  /auth/freeze: { post: *standardPost }
  /auth/mfa/step-up: { post: *standardPost }
  /auth/phone/start: { post: *standardPost }
  /auth/phone/verify: { post: *standardPost }
  /security/step-up: { post: *standardPost }
  /security/sessions: { get: *standardGet }
  /security/sessions/{session_id}: { delete: *standardDelete }
  /security/api-keys:
    get: *standardGet
    post: *standardPost
  /security/api-keys/{key_id}: { delete: *standardDelete }
  /user/sessions:
    get: *standardGet
    delete: *standardDelete
  /user/sessions/{session_id}: { delete: *standardDelete }
  /security/anti-phishing-code:
    get: *standardGet
    post: *standardPost
    put: &standardPut
      responses:
        '200': { description: Successful response }
        default: { $ref: '#/components/responses/Error' }
    delete: *standardDelete
  /security/totp/enroll: { post: *standardPost }
  /security/totp/confirm: { post: *standardPost }
  /security/totp: { delete: *standardDelete }
  /wallet/balances: { get: *standardGet }
  /accounts/subaccounts:
    get: *standardGet
    post: *standardPost
  /accounts/switch: { post: *standardPost }
  /accounts/subaccounts/{account_id}: { get: *standardGet, delete: *standardDelete }
  /accounts/subaccounts/{account_id}/balances: { get: *standardGet }
  /accounts/subaccounts/{account_id}/freeze: { post: *standardPost }
  /accounts/subaccounts/{account_id}/unfreeze: { post: *standardPost }
  /user/profile: { get: *standardGet }
  /user/preferences: { put: *standardPut }
  /user/limits: { get: *standardGet }
  /user/pnl: { get: *standardGet }
  /user/daily-pnl: { get: *standardGet }
  /accounts/pnl: { get: *standardGet }
  /kyc/applications: { post: *standardPost }
  /kyc/status: { get: *standardGet }
  /transfers/recipients/resolve: { post: *standardPost }
  /conversions/confirm: { post: *standardPost }
  /conversions: { get: *standardGet }
  /market/prices: { get: *standardGet }
  /deposits/addresses: { post: *standardPost }
  /deposits: { get: *standardGet }
  /wallet/withdrawals:
    get: *standardGet
    post: *standardPost
  /withdrawals/{withdrawal_id}/cancel: { post: *standardPost }
  /withdrawals/{withdrawal_id}/travel-rule: { post: *standardPost }
  /withdrawal-addresses:
    get: *standardGet
    post: *standardPost
  /withdrawal-addresses/{address_id}: { delete: *standardDelete }
  /notification-devices: { post: *standardPost }
  /notifications/device-token: { post: *standardPost }
  /admin/deposits/{deposit_id}/approve: { post: *standardPost }
  /admin/withdrawals/{withdrawal_id}/approvals: { post: *standardPost }
  /admin/operational-controls/withdrawals:
    get: *standardGet
    put: *standardPut
  /admin/users/{user_id}/roles: { get: *standardGet }
  /admin/users/{user_id}/roles/{role}:
    put: *standardPut
    delete: *standardDelete
  /admin/conversion-pairs: { put: *standardPut }
  /admin/kyc/applications: { get: *standardGet }
  /admin/kyc/pending: { get: *standardGet }
  /admin/kyc/{id}: { get: *standardGet }
  /admin/kyc/{id}/approve: { post: *standardPost }
  /admin/kyc/{id}/reject: { post: *standardPost }
  /admin/operational-controls/conversions:
    get: *standardGet
    put: *standardPut
components:
  headers:
    XRateLimitLimit:
      description: Maximum number of requests allowed in the current window.
      schema: { type: integer, format: int32 }
    XRateLimitRemaining:
      description: Remaining requests in the current window.
      schema: { type: integer, format: int32 }
    XRateLimitReset:
      description: Unix time when the quota resets.
      schema: { type: integer, format: int64 }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 255 }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: limiance_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyHmac:
      type: apiKey
      in: header
      name: X-API-Key
      description: Use X-API-Timestamp, X-API-Nonce, and X-API-Signature. The lowercase hexadecimal HMAC-SHA256 signs `timestamp\nnonce\nMETHOD\nescaped_path\nraw_query\nhex(sha256(raw_body))`. Nonces are single-use inside the permitted timestamp window.
  responses:
    Error:
      description: Standard API error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ErrorDetails:
      type: object
      additionalProperties: true
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { $ref: '#/components/schemas/ErrorDetails' }
            request_id: { type: string }
    CatalogItem:
      type: object
      required: [code, display_name, status]
      properties:
        code: { type: string }
        display_name: { type: string }
        status:
          type: string
          enum:
            - approved_pending_network_enablement
            - approved_pending_custody_enablement
    CreateNotificationRequest:
      type: object
      required: [event_type, reference_id, title, body]
      properties:
        event_type: { type: string }
        reference_id: { type: string, minLength: 1, maxLength: 255 }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 2000 }
        priority: { type: string, enum: [urgent, high, normal, low] }
        metadata: { type: object, additionalProperties: true }
    Notification:
      type: object
      required: [id, event_type, reference_id, title, body, priority, created_at]
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        reference_id: { type: string }
        title: { type: string }
        body: { type: string }
        priority: { type: string, enum: [urgent, high, normal, low] }
        metadata: { type: object, additionalProperties: true }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    NotificationResponse:
      type: object
      required: [notification, created]
      properties:
        notification: { $ref: '#/components/schemas/Notification' }
        created: { type: boolean }
    NotificationListResponse:
      type: object
      required: [notifications, unread_count, limit, has_more]
      properties:
        notifications:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        unread_count: { type: integer, format: int64 }
        limit: { type: integer }
        has_more: { type: boolean }
    ErrorResponse:
      type: object
      description: Standard API error envelope.
      $ref: '#/components/schemas/ApiError'
